<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaft.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <title>Login</title>

</head>
<body>
    <div class="login-container">
        <div class="login-image-logo-container">
            <img th:src="@{/imgs/not-sneaky-golem.jpg}" alt="">
        </div>
        <div class="login-form">
            <form th:action="@{/login}" method="post" class="login-form">
                <h4 class="login-title">Login</h4>
                <input type="text" name="username" id="username" required placeholder="Username">
                <input type="password" name="password" id="password" required placeholder="Password">
                <div class="login-button-container">
                    <button type="submit">Entrar</button>
                </div>

                <p class="login-redirect-options">
                    Ainda não tem cadastro? <br>
                    <a href="/register">Cadastre-se</a> | 
                    <a href="/recoverpassword">Esqueceu sua senha</a>

                </p>
            </form>
        </div>
    </div>
</body>
</html>
